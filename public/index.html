<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNO Online</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/home.css">
</head>
<body>

  <!-- Floating cards background -->
  <div class="floating-cards" id="floatingCards" aria-hidden="true"></div>

  <!-- Main content -->
  <main class="home-container">

    <!-- UNO Logo -->
    <div class="uno-logo" aria-label="UNO Online logo">
      <div class="uno-logo-card">
        <div class="uno-quadrant q-red"></div>
        <div class="uno-quadrant q-blue"></div>
        <div class="uno-quadrant q-green"></div>
        <div class="uno-quadrant q-yellow"></div>
        <span class="uno-logo-text">UNO</span>
      </div>
    </div>

    <h1 class="home-title">UNO <span class="accent-text">Online</span></h1>
    <p class="home-subtitle">Play the classic card game with friends</p>

    <!-- Player name panel -->
    <section class="glass-panel home-panel">
      <label class="input-label" for="playerName">Your Name</label>
      <div class="input-row">
        <input
          type="text"
          id="playerName"
          placeholder="Enter your name..."
          maxlength="20"
          autocomplete="off"
          spellcheck="false"
        >
      </div>
    </section>

    <!-- Create / Join panels -->
    <div class="panels-row">

      <!-- Create Room -->
      <section class="glass-panel home-panel">
        <h2 class="panel-title">Create a Room</h2>
        <p class="panel-desc">Start a new game and invite friends</p>
        <button class="btn-primary btn-block" id="btnCreateRoom">
          Create Room
        </button>
      </section>

      <div class="panels-divider">
        <span>or</span>
      </div>

      <!-- Join Room -->
      <section class="glass-panel home-panel">
        <h2 class="panel-title">Join a Room</h2>
        <p class="panel-desc">Enter a room code to join an existing game</p>
        <div class="input-row">
          <input
            type="text"
            id="roomCodeInput"
            placeholder="Room code..."
            maxlength="10"
            autocomplete="off"
            spellcheck="false"
          >
          <button class="btn-primary" id="btnJoinRoom">
            Join
          </button>
        </div>
      </section>

    </div>

    <footer class="home-footer">
      <p>2 - 10 players &middot; No sign-up required</p>
    </footer>

  </main>

  <!-- Toast container (used by global.css styles) -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Connection status indicator -->
  <div class="connection-status" id="connectionStatus">
    <span class="connection-dot" id="connectionDot"></span>
    <span id="connectionLabel">Connecting...</span>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/home.js"></script>
</body>
</html>
